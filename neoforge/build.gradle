plugins {
    id 'com.github.johnrengelman.shadow'
}

def generatedResources = project(":common").file("src/main/generated/resources")

sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    runs {
        data {
            data()
            programArgs("--all", "--mod", "${mod_id}")
            programArgs("--output", generatedResources.absolutePath)
            programArgs("--existing", project(":common").file("src/main/resources").absolutePath)
        }
    }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "OctoStudios"
        url = uri("https://maven.octo-studios.com/releases")
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    modRuntimeOnly "dev.emi:emi-neoforge:${emi_version}"

    modCompileOnly "vazkii.patchouli:Patchouli:${patchouli_version_neoforge}:api"
    modRuntimeOnly "vazkii.patchouli:Patchouli:${patchouli_version_neoforge}"
    modCompileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}:api")
    modRuntimeOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}")
    modImplementation("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")
    modRuntimeOnly( "maven.modrinth:spark:${spark_version}-neoforge" )

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
